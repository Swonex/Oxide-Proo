name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Direct Compile
      run: |
        mkdir -p .theos/_/Library/MobileSubstrate/DynamicLibraries/
        clang -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0 Tweak.mm -o .theos/_/Library/MobileSubstrate/DynamicLibraries/OxidePro.dylib -framework UIKit -framework Foundation -framework CoreGraphics

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OxidePro-dylib
        path: .theos/_/Library/MobileSubstrate/DynamicLibraries/
